runs-on: ${{ matrix.os }}

steps:
# 1. 把您的代码拉取到云电脑上
- name: Checkout Code
  uses: actions/checkout@v4

# 2. 在云电脑上安装 Python
- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: '3.10'

# 3. 安装您软件需要的依赖库
- name: Install Dependencies
  run: |
    python -m pip install --upgrade pip
    pip install tk opencv-python pillow tkinterdnd2 pyinstaller

# 4. 运行我们之前写的打包脚本
- name: Build Application
  run: python build_app.py

# 5. 将打包好的软件上传，供您下载 (已更新至最新支持的 v4)
- name: Upload Artifacts (Windows)
  if: matrix.os == 'windows-latest'
  uses: actions/upload-artifact@v4
  with:
    name: MediaSorter-Windows
    path: dist/MediaSorter

- name: Upload Artifacts (macOS)
  if: matrix.os == 'macos-latest'
  uses: actions/upload-artifact@v4
  with:
    name: MediaSorter-macOS
    path: dist/MediaSorter.app
